<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17B3A3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Orbita</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
:root{
  --ink:#2B1840;--cream:#FFF6E0;--gold:#FFC72E;--coral:#FF5470;
  --bg:#17B3A3;--bgd:#0B8684;--pop:#FF5470;--body:#93E23C;--shade:#4FAE22;--fline:#2B1840;
  --disp:"Bagel Fat One","Arial Rounded MT Bold",ui-rounded,"Trebuchet MS",system-ui,sans-serif;
  --text:"Baloo 2",ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --ol2:1.3px 0 0 var(--ink),-1.3px 0 0 var(--ink),0 1.3px 0 var(--ink),0 -1.3px 0 var(--ink),1px 1px 0 var(--ink),-1px 1px 0 var(--ink),1px -1px 0 var(--ink),-1px -1px 0 var(--ink),0 2.6px 0 var(--ink);
  --ol:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),1.5px 1.5px 0 var(--ink),-1.5px 1.5px 0 var(--ink),1.5px -1.5px 0 var(--ink),-1.5px -1.5px 0 var(--ink),0 4.5px 0 var(--ink),1.5px 4px 0 var(--ink),-1.5px 4px 0 var(--ink);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:var(--bg);color:var(--cream);font-family:var(--text);font-weight:600;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;touch-action:manipulation}
body{-webkit-touch-callout:none}
#c{display:block;position:fixed;inset:0;touch-action:none}
.disp{font-family:var(--disp);font-weight:900;font-synthesis:none}
svg{display:block}

/* ---------- boutons jouets ---------- */
.btn{appearance:none;-webkit-appearance:none;font-family:var(--disp);font-weight:900;font-synthesis:none;font-size:18px;line-height:1.1;color:var(--ink);
  background:var(--cream);border:3px solid var(--ink);border-radius:20px;padding:12px 16px 13px;cursor:pointer;position:relative;
  box-shadow:0 5px 0 var(--ink);transition:transform .07s,box-shadow .07s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(4px) scale(.985,.96);box-shadow:0 1px 0 var(--ink)}
.btn.pri{background:var(--pop);font-size:25px;border-radius:24px;padding:14px 20px 16px;box-shadow:0 7px 0 var(--ink)}
.btn.pri:active{transform:translateY(6px) scale(.985,.95);box-shadow:0 1px 0 var(--ink)}
.btn svg{flex:none}
.rbtn{appearance:none;-webkit-appearance:none;pointer-events:auto;width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:var(--cream);
  box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;flex:none;transition:transform .07s,box-shadow .07s}
.rbtn:active{transform:translateY(3px) scale(.97,.94);box-shadow:0 1px 0 var(--ink)}
.row{display:flex;gap:10px}.row .btn{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--ink);color:var(--cream);border-radius:99px;padding:4px 12px 5px 8px;font-family:var(--disp);font-weight:900;font-synthesis:none;font-size:16px;line-height:1}
.chip svg{width:17px;height:17px}

/* ---------- ATH ---------- */
#hud{position:fixed;top:calc(10px + var(--sat));left:50%;transform:translateX(-50%);width:min(100%,520px);padding:0 12px;display:none;align-items:flex-start;justify-content:space-between;z-index:4;pointer-events:none}
#hud.show{display:flex}
#hudMid{flex:1;text-align:center;min-width:0;padding-top:1px}
#hudName{font-size:21px;line-height:1.15;color:var(--cream);text-shadow:var(--ol);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
#hudMood{display:inline-block;margin-top:5px;font-size:12.5px;font-weight:800;line-height:1.2;background:var(--ink);color:var(--cream);padding:2px 11px 3px;border-radius:99px;white-space:nowrap}
#hudMood.flip{animation:flip .5s}
@keyframes flip{0%{transform:scale(1)}35%{transform:scale(1.25) rotate(-3deg);background:var(--coral)}100%{transform:scale(1)}}
#hudStars{display:flex;width:76px;justify-content:flex-end;padding-top:9px}
#hudStars svg{width:25px;height:25px;margin-left:-1px}
.st path{fill:rgba(43,24,64,.28);stroke:var(--ink);stroke-width:1.9;stroke-linejoin:round}
.st.on path{fill:var(--gold)}
.st.on{animation:pop .45s cubic-bezier(.3,1.9,.5,1)}
@keyframes pop{0%{transform:scale(.2) rotate(-40deg)}100%{transform:none}}

#banner{position:fixed;left:50%;top:62%;width:min(94%,430px);transform:translateX(-50%);z-index:4;pointer-events:none;text-align:center;opacity:0}
#banner.go{animation:ban 1.9s both}
@keyframes ban{0%{opacity:0;transform:translate(-50%,16px) scale(.7)}9%{opacity:1;transform:translate(-50%,0) scale(1.06)}15%{transform:translate(-50%,0) scale(1)}84%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-8px) scale(.96)}}
.bk{display:inline-block;font-family:var(--disp);font-weight:900;font-synthesis:none;font-size:13px;letter-spacing:.14em;background:var(--ink);color:var(--cream);padding:3px 13px 4px;border-radius:99px;text-transform:uppercase}
.bk.boss{background:var(--coral);color:var(--ink);box-shadow:0 0 0 3px var(--ink)}
.bt{font-size:clamp(34px,11.5vw,48px);line-height:1.05;color:var(--cream);text-shadow:var(--ol);margin:1px 0 3px}
.bs{font-size:16px;font-weight:800;line-height:1.25;color:var(--cream);text-shadow:var(--ol2)}
.bs b{font-weight:800;background:var(--ink);padding:1px 10px 2px;border-radius:99px;margin-right:4px;white-space:nowrap;text-shadow:none;display:inline-block;margin-top:3px}
#tip{position:fixed;left:50%;top:70%;transform:translateX(-50%);z-index:3;pointer-events:none;white-space:nowrap;font-size:16px;font-weight:800;color:var(--ink);
  background:var(--cream);border:3px solid var(--ink);border-radius:99px;padding:4px 14px 5px;box-shadow:0 4px 0 var(--ink);opacity:0;transition:opacity .2s}
#tip.on{opacity:1;animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{50%{transform:translate(-50%,-5px)}}

/* ---------- écrans ---------- */
.screen{position:fixed;inset:0;display:none;z-index:5}
#menu{flex-direction:column;align-items:center;padding:calc(12px + var(--sat)) 18px calc(18px + var(--sab));pointer-events:none}
#menu.show{display:flex}
#menu button{pointer-events:auto}
.mcol{width:min(100%,430px);flex:1;min-height:0;display:flex;flex-direction:column}
.mtop{display:flex;justify-content:space-between;align-items:center;min-height:46px}
.logo{width:min(88%,330px);height:auto;margin:6px 0 0 -2px;transform:rotate(-4deg);transform-origin:20% 50%;overflow:visible}
.logo .lt{animation:bob 2.6s ease-in-out infinite}
.logo .lt:nth-child(2){animation-delay:.12s}.logo .lt:nth-child(3){animation-delay:.24s}.logo .lt:nth-child(4){animation-delay:.36s}.logo .lt:nth-child(5){animation-delay:.48s}.logo .lt:nth-child(6){animation-delay:.6s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.tag{font-size:17.5px;font-weight:800;line-height:1.2;margin:2px 0 0 8px;color:var(--cream);text-shadow:var(--ol2)}
#spacer{flex:1;min-height:90px}
.mbot{display:flex;flex-direction:column;gap:13px}
#menu.show .mbot{animation:rise .45s cubic-bezier(.3,1.4,.5,1) both}
#menu.show .logo{animation:drop .5s cubic-bezier(.3,1.4,.5,1) both}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
@keyframes drop{from{transform:translateY(-30px) rotate(-10deg);opacity:0}}
#playBtn{justify-content:space-between;text-align:left;padding:11px 12px 13px 22px}
#playBtn .l1{display:block;font-size:31px;line-height:1}
#playBtn .l2{display:block;font-family:var(--text);font-weight:800;font-size:14.5px;line-height:1.2;opacity:.82;margin-top:2px}
#playBtn .go{width:54px;height:54px;border-radius:50%;background:var(--ink);display:grid;place-items:center;flex:none}

#levels{background:var(--bgd);flex-direction:column;align-items:center}
#levels.show{display:flex}
.lhead{width:min(100%,470px);display:flex;align-items:center;gap:12px;padding:calc(10px + var(--sat)) 14px 10px}
.lhead h2{flex:1;font-size:27px;line-height:1;color:var(--cream);text-shadow:var(--ol)}
#wlist{flex:1;min-height:0;width:min(100%,470px);overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:6px 14px calc(26px + var(--sab));display:flex;flex-direction:column;gap:16px;scrollbar-width:none}
#wlist::-webkit-scrollbar{display:none}
.wc{flex:none;background:var(--wbg);border:3px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);padding:11px 12px 14px}
.wh{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.wh canvas{width:64px;height:64px;flex:none}
.wh>div{min-width:0;flex:1}
.wk{font-size:11.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--cream);opacity:.9;line-height:1.1}
.wn{font-size:27px;line-height:1.05;color:var(--cream);text-shadow:var(--ol);margin-bottom:5px}
.ws2{font-size:13.5px;font-weight:800;line-height:1.15;color:var(--cream);text-shadow:0 1.5px 0 rgba(43,24,64,.45)}
.wh .chip{align-self:flex-start;font-size:14px;padding:4px 10px 5px 7px}.wh .chip svg{width:15px;height:15px}
.wl{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{appearance:none;-webkit-appearance:none;aspect-ratio:1;border-radius:17px;border:3px solid var(--ink);background:var(--cream);color:var(--ink);font-family:var(--disp);font-weight:900;font-synthesis:none;font-size:22px;line-height:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;box-shadow:0 4px 0 var(--ink);position:relative;padding:2px 0 0;transition:transform .07s,box-shadow .07s}
.lv:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.lv i{display:flex;gap:2.5px;height:8px}
.lv i b{width:8px;height:8px;border-radius:50%;background:rgba(43,24,64,.16)}
.lv i b.on{background:var(--gold);box-shadow:inset 0 0 0 1.6px var(--ink)}
.lv.cur{background:var(--wpop)}
.lv.cur::after{content:"";position:absolute;inset:-9px;border:3px dashed var(--cream);border-radius:24px;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lv.boss{background:var(--ink);color:var(--cream)}
.lv.boss i b{background:rgba(255,246,224,.22)}
.lv.boss i b.on{background:var(--gold);box-shadow:none}
.lv.boss::before{content:"";position:absolute;left:50%;top:-12px;width:64%;height:12px;transform:translateX(-50%);
  background:linear-gradient(135deg,transparent 50%,var(--ink) 50%) left/50% 100% no-repeat,linear-gradient(225deg,transparent 50%,var(--ink) 50%) right/50% 100% no-repeat;
  -webkit-mask:linear-gradient(90deg,#000 32%,transparent 32%,transparent 68%,#000 68%);mask:linear-gradient(90deg,#000 32%,transparent 32%,transparent 68%,#000 68%)}
.lv:disabled{background:rgba(43,24,64,.2);color:rgba(255,246,224,.5);box-shadow:none;border:3px dashed rgba(43,24,64,.5);cursor:default;transform:none}
.lv:disabled i{visibility:hidden}
.lv.boss:disabled{background:rgba(43,24,64,.45)}
.lv.boss:disabled::before{opacity:.45}
.wc.lock .wh{opacity:.85}
.wend{flex:none;text-align:center;font-size:14px;font-weight:700;color:var(--cream);opacity:.75;padding:2px 0 8px}

/* ---------- feuilles du bas ---------- */
.sheet{position:fixed;left:50%;bottom:-40px;width:min(100%,460px);transform:translate(-50%,110%);z-index:6;background:var(--cream);color:var(--ink);
  border:3px solid var(--ink);border-bottom:0;border-radius:30px 30px 0 0;padding:20px 18px calc(58px + var(--sab));display:flex;flex-direction:column;gap:12px;text-align:center;
  visibility:hidden;transition:transform .2s ease-in,visibility 0s .2s}
.sheet.show{transform:translate(-50%,0);visibility:visible;transition:transform .36s cubic-bezier(.25,1.45,.45,1)}
.sheet h2{font-size:28px;line-height:1.05}
.sheet .sub{font-size:16px;font-weight:700;line-height:1.3;color:rgba(43,24,64,.84);margin-top:-6px;min-height:20px}
.sheet .sub b{font-weight:800;background:var(--ink);color:var(--cream);padding:1px 9px 2px;border-radius:99px;margin-right:3px;white-space:nowrap}
#win{padding-top:46px}
#winStars{position:absolute;left:0;right:0;top:-44px;display:flex;justify-content:center;align-items:flex-end;gap:2px;pointer-events:none}
#winStars svg{width:72px;height:72px;overflow:visible}
#winStars svg:nth-child(1){rotate:-12deg}#winStars svg:nth-child(2){margin-bottom:14px}#winStars svg:nth-child(3){rotate:12deg}
#winStars .st path{fill:#D9CDB2;stroke-width:1.5}
#winStars .st.on path{fill:var(--gold)}
#winStars .st{animation:none}
#winStars .st.on{animation:pop .5s cubic-bezier(.3,1.9,.5,1) both}
#track{display:flex;justify-content:center;align-items:center;gap:0;margin:-2px 0 0}
#track b{width:17px;height:17px;border-radius:50%;border:3px solid var(--ink);background:transparent;position:relative}
#track b.done{background:var(--ink)}
#track b.now{background:var(--pop);transform:scale(1.25)}
#track b.boss{border-radius:5px;transform:rotate(45deg)}
#track b.boss.now{transform:rotate(45deg) scale(1.25)}
#track s{width:20px;height:3px;background:var(--ink);opacity:.35}
#track s.done{opacity:1}
#fail h2{color:var(--coral);-webkit-text-stroke:0;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),1.5px 1.5px 0 var(--ink),-1.5px 1.5px 0 var(--ink),1.5px -1.5px 0 var(--ink),-1.5px -1.5px 0 var(--ink),0 4px 0 var(--ink);font-size:34px;padding-bottom:4px}
.failrow{display:flex;align-items:center;justify-content:space-between;margin:-4px 2px -6px}
.hintline{font-size:14px;font-weight:700;opacity:.6}
#pause .rbtn{position:absolute;right:16px;top:16px;width:42px;height:42px;box-shadow:0 3px 0 var(--ink)}
.linkbtn{appearance:none;-webkit-appearance:none;background:none;border:0;font-family:var(--disp);font-weight:900;font-synthesis:none;font-size:16px;color:var(--ink);opacity:.8;padding:8px 6px 8px 14px;cursor:pointer;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}

@media (max-height:600px){.tag{display:none}.logo{width:min(70%,260px)}}
@media (max-height:500px) and (orientation:landscape){
  .mcol{width:min(100%,760px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto 1fr auto;column-gap:24px}
  .mtop{grid-column:1/3;grid-row:1;position:relative;z-index:2}
  .logo{grid-column:1;grid-row:2;width:min(92%,240px);margin-top:0}
  #spacer{grid-column:2;grid-row:2/5;min-height:0}
  .mbot{grid-column:1;grid-row:4;gap:10px}
  #playBtn{padding:7px 10px 9px 18px}#playBtn .l1{font-size:25px}#playBtn .go{width:44px;height:44px}
  .mbot .btn:not(.pri){padding:8px 14px 9px}
  .sheet{padding-top:14px;gap:8px}.sheet h2{font-size:23px}.sheet .btn.pri{padding:9px 20px 11px;font-size:21px}.sheet .btn:not(.pri){padding:8px 12px 9px}
  #win{padding-top:34px}#winStars svg{width:54px;height:54px}#winStars{top:-34px}#track{display:none}
  .sheet{left:auto;right:max(10px,env(safe-area-inset-right));width:min(50%,430px);transform:translate(0,110%)}
  .sheet.show{transform:translate(0,0)}
}
@media (prefers-reduced-motion:reduce){
  .logo .lt,#tip.on,.lv.cur::after,.st.on,#winStars .st.on,#hudMood.flip{animation:none}
  #menu.show .mbot,#menu.show .logo{animation:none}
  .sheet.show{transition:transform .15s linear}
  #banner.go{animation:banr 1.9s both}
  @keyframes banr{0%{opacity:0}8%{opacity:1}88%{opacity:1}100%{opacity:0}}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sat" style="position:fixed;top:0;height:env(safe-area-inset-top);width:0;pointer-events:none"></div>
<div id="sab" style="position:fixed;bottom:0;height:env(safe-area-inset-bottom);width:0;pointer-events:none"></div>

<div id="hud">
  <button id="hudBtn" class="rbtn" aria-label="Pause"><svg viewBox="0 0 24 24" width="22" height="22"><rect x="4.5" y="4" width="5.5" height="16" rx="2.2" fill="#2B1840"/><rect x="14" y="4" width="5.5" height="16" rx="2.2" fill="#2B1840"/></svg></button>
  <div id="hudMid"><div id="hudName" class="disp"></div><div id="hudMood"></div></div>
  <div id="hudStars" aria-label="Étoiles"></div>
</div>
<div id="banner"><div class="bk" id="bk"></div><div class="bt disp" id="bt"></div><div class="bs" id="bs"></div></div>
<div id="tip"></div>

<div id="menu" class="screen">
  <div class="mcol">
    <div class="mtop">
      <span class="chip" id="totalStars"></span>
      <button class="rbtn" id="soundBtn" aria-label="Son"></button>
    </div>
    <svg class="logo" viewBox="-18 -30 446 160" role="img" aria-label="Orbita">
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <g transform="translate(0,9)" stroke="#2B1840" stroke-width="31">
          <circle cx="40" cy="66" r="38" fill="#2B1840"/>
          <path d="M106,104V32h22a20,20 0 0 1 0,40h-22M130,73l18,31"/><path d="M174,32v72h26a19,19 0 0 0 0-38h-26M174,32h22a17,17 0 0 1 0,34"/><path d="M246,32v72"/><path d="M272,32h56M300,32v72"/><path d="M344,104l28-72 28,72M355,82h34"/>
        </g>
        <g class="lt"><g transform="translate(40 66) scale(1.14) translate(-46 -66)"><path d="M52,26 C50,12 56,2 66,-4" stroke="#2B1840" stroke-width="14"/><path d="M52,26 C50,12 56,2 66,-4" stroke="#D5F56B" stroke-width="6.5"/><circle cx="68" cy="-7" r="11" fill="#FFF6E0" stroke="#2B1840" stroke-width="5"/>
          <circle cx="46" cy="66" r="44" fill="var(--body)" stroke="#2B1840" stroke-width="7"/>
          <path d="M6,80 A44,44 0 0 0 86,80 A54,54 0 0 1 6,80Z" fill="var(--shade)" stroke="none" opacity=".8"/>
          <ellipse cx="29" cy="43" rx="12.5" ry="6.5" fill="#fff" opacity=".6" transform="rotate(-32 29 43)" stroke="none"/>
          <ellipse cx="22" cy="78" rx="6.5" ry="4.2" fill="#FF8FA3" stroke="none" opacity=".85"/><ellipse cx="72" cy="78" rx="6.5" ry="4.2" fill="#FF8FA3" stroke="none" opacity=".85"/>
          <ellipse cx="33" cy="63" rx="9.5" ry="11" fill="#fff" stroke="#2B1840" stroke-width="3.2"/><ellipse cx="61" cy="63" rx="9.5" ry="11" fill="#fff" stroke="#2B1840" stroke-width="3.2"/>
          <circle cx="36" cy="65" r="5.4" fill="#2B1840" stroke="none"/><circle cx="64" cy="65" r="5.4" fill="#2B1840" stroke="none"/>
          <circle cx="34.2" cy="63" r="1.9" fill="#fff" stroke="none"/><circle cx="62.2" cy="63" r="1.9" fill="#fff" stroke="none"/>
          <path d="M39,85 Q47,93 56,85" stroke="var(--fline)" stroke-width="3.8"/>
        </g></g>
        <g class="lt"><path d="M106,104V32h22a20,20 0 0 1 0,40h-22M130,73l18,31" stroke="#2B1840" stroke-width="31"/><path d="M106,104V32h22a20,20 0 0 1 0,40h-22M130,73l18,31" stroke="#FFF6E0" stroke-width="17"/></g>
        <g class="lt"><path d="M174,32v72h26a19,19 0 0 0 0-38h-26M174,32h22a17,17 0 0 1 0,34" stroke="#2B1840" stroke-width="31"/><path d="M174,32v72h26a19,19 0 0 0 0-38h-26M174,32h22a17,17 0 0 1 0,34" stroke="#FFF6E0" stroke-width="17"/></g>

/* ---------- boucle ---------- */
function stepFx(dt) {

  for (const s of stuck) {
    if (s.k < 1) s.k = Math.min(1, s.k + dt * 7);

function update(dt) {

  if (L && (state === 'play' || state === 'dying' || state === 'winning')) {

    rot += speedAt(t) * dt * (state === 'dying' ? Math.max(0, 1 - dieT * 5) : 1);
  } else if (L && state === 'won') rot += dt * .32 * L.dir;

  if (state === 'play') {
    introT += dt; readyK = fuming() ? 0 : Math.min(1, readyK + dt * 9);
    for (const s of stuck) if (s.crit) {      // la bestiole fait demi-tour devant un obstacle
      const na = s.a + s.v * dt; let blocked = false;
      for (const o of stuck) if (o !== s) { const dd = sdiff(o.a, na); if (Math.abs(dd) < GAP * 1.55 && dd * s.v > 0) { blocked = true; break; } }
      if (blocked) s.v = -s.v; else { s.a = norm(na); s.dirv = s.v < 0 ? -1 : 1; }

      if (flying.y <= cy + R) {

}

/* Prédicteur honnête pour le banc d'essai : vrai seulement si lancer MAINTENANT laisse ~0,7×GAP de marge

}
function resumeGame() { if (state !== 'pause') return; $('pause').classList.remove('show'); state = 'play'; last = performance.now(); }
function toggleSound() { soundOn = !soundOn; store.set('sound', soundOn); soundIcons(); if (soundOn) { unlockAudio(); sfx('star', 1); } }

/* ---------- entrées ---------- */
const tapBtn = (id, fn) => { $(id).addEventListener('click', e => { e.stopPropagation(); unlockAudio(); fn(e); }); };
tapBtn('playBtn', () => { sfx('ui'); startLevel(unlocked); });
tapBtn('levelsBtn', () => { sfx('ui'); showLevels(); });
tapBtn('levelsBack', () => { sfx('ui'); showMenu(); });
tapBtn('soundBtn', toggleSound);
tapBtn('soundBtn2', toggleSound);
tapBtn('nextBtn', () => startLevel(L.n + 1));
tapBtn('replayBtn', () => { prevN = 0; startLevel(L.n); });
tapBtn('winMenu', () => { sfx('ui'); showMenu(); });
tapBtn('failMenu', () => { sfx('ui'); showMenu(); });
tapBtn('hudBtn', () => { sfx('ui'); pauseGame(); });
tapBtn('resumeBtn', () => { sfx('ui'); resumeGame(); });
tapBtn('restartBtn', () => startLevel(L.n));
tapBtn('pauseMenu', () => { sfx('ui'); showMenu(); });
$('fail').addEventListener('click', () => { unlockAudio(); if (state === 'failed') startLevel(L.n); });      // toute la feuille relance

cvs.addEventListener('pointerdown', e => {
  e.preventDefault(); unlockAudio();
  if (state === 'play') throwPin();
  else if (state === 'failed' || (state === 'dying' && dieT > .3)) startLevel(L.n);      // rejouer : un seul toucher, sans attendre
  else if (state === 'menu') {
    const dx = e.clientX - menuX, dy = e.clientY - menuY;
    if (dx * dx + dy * dy < menuR * menuR * 1.5) {
      tickle = .8; sq.v += reduce ? .6 : 3; sfx('giggle'); vib(10);
      for (let i = 0; i < 3; i++) addPart({ x: menuX + (i - 1) * menuR * .5, y: menuY - menuR * .8, vx: (i - 1) * 40, vy: -120 - (i % 2) * 40, g: 60, life: 1, max: 1, c: CORAL, s: menuR * .1, sh: 3, r: 0, vr: 0 });
    }
  }
});
addEventListener('pointermove', e => { if (e.pointerType === 'mouse') ptr = { x: e.clientX, y: e.clientY }; });
document.documentElement.addEventListener('mouseleave', () => { ptr = null; });
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') {
    if (e.target && e.target.tagName === 'BUTTON' && e.code === 'Enter') return;
    e.preventDefault(); if (e.repeat) return; unlockAudio();
    if (state === 'play') throwPin();
    else if (state === 'failed' || (state === 'dying' && dieT > .3)) startLevel(L.n);
    else if (state === 'won') startLevel(L.n + 1);
    else if (state === 'pause') resumeGame();
    else if (state === 'menu') startLevel(unlocked);
  } else if (e.code === 'Escape' || e.code === 'KeyP') {
    if (state === 'play') pauseGame(); else if (state === 'pause') resumeGame(); else if (state === 'levels') showMenu();
  }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); else last = performance.now(); });
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 120));

let last = performance.now();
function loop(now) {
  const dt = Math.min(.033, Math.max(0, (now - last) / 1000)); last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
resize();
showMenu();
requestAnimationFrame(loop);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
