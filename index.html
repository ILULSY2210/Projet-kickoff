<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04070a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Orbita</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
/* polices hébergées avec le jeu (fonts/, licence OFL) : aucune ressource tierce au démarrage */
@font-face{font-family:"B612";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/b612-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"B612";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/b612-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"B612 Mono";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/b612-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"B612 Mono";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/b612-mono-latin-700-normal.woff2) format("woff2")}
:root{
  --ink:#04070a;--ink2:#080d12;
  --c:#4dffa6;--rgb:77,255,166;--hi:#e6fff2;--acc:#ffd35c;--alert:#ff3b52;--alert-rgb:255,59,82;--lab:.65;
  --sx:0px;--sw:100vw;
  --mono:"B612 Mono",ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:"B612","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:var(--ink);color:var(--c);font-family:var(--mono);overflow:hidden;overscroll-behavior:none}
canvas{display:block;position:fixed;inset:0;touch-action:none}
#bloom{pointer-events:none;mix-blend-mode:plus-lighter}
@supports not (mix-blend-mode:plus-lighter){#bloom{mix-blend-mode:screen}}
svg.vt{display:block;overflow:visible;flex:none}

/* ---------- écrans ---------- */
.screen{position:fixed;top:0;bottom:0;left:var(--sx);width:var(--sw);display:none;flex-direction:column;z-index:5;
  padding:calc(max(14px,env(safe-area-inset-top)) + 8px) 20px calc(max(14px,env(safe-area-inset-bottom)) + 6px)}
.screen.show{display:flex}
.kick{font-size:10.5px;line-height:1.3;letter-spacing:.16em;text-transform:uppercase;color:rgba(var(--rgb),var(--lab))}
.txt{font-family:var(--sans);font-size:13.5px;line-height:1.5;color:rgba(var(--rgb),.82);letter-spacing:.01em}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* ---------- boutons : plaques chanfreinées ---------- */
.btn{position:relative;appearance:none;border:0;border-radius:0;font:inherit;cursor:pointer;height:46px;padding:0 14px;min-width:0;
  display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--c);background:rgba(var(--rgb),.5);
  clip-path:polygon(0 0,calc(100% - 11px) 0,100% 11px,100% 100%,11px 100%,0 calc(100% - 11px));
  transition:filter .08s,transform .08s}
.btn::before{content:'';position:absolute;inset:1px;background:var(--ink2);
  clip-path:polygon(0 0,calc(100% - 10.6px) 0,100% 10.6px,100% 100%,10.6px 100%,0 calc(100% - 10.6px))}
.btn>*{position:relative}
.btn .aux{display:flex;align-items:center;gap:8px;opacity:.75}
.btn:active{transform:translateY(1px);filter:brightness(1.35)}
.btn:focus-visible{outline:0;filter:brightness(1.3)}
.btn.pri{height:58px;padding:0 18px;background:var(--c);color:var(--ink)}
.btn.pri::before{display:none}
.btn.pri .aux{opacity:.8}
.pw{filter:drop-shadow(0 0 14px rgba(var(--rgb),.32))}
.pw .btn{width:100%}
.row{display:flex;gap:10px}
.row>*{flex:1 1 50%;min-width:0}

/* ---------- menu ---------- */
#menu{justify-content:space-between}
#menu>*{animation:rise .32s cubic-bezier(.2,.8,.2,1) both}
#menu .mbot{animation-delay:.08s}
.mtop{display:flex;flex-direction:column;gap:12px;padding-top:6px}
#logo{display:block;width:min(100%,340px);height:auto;color:var(--c);filter:drop-shadow(0 0 10px rgba(var(--rgb),.4))}
#logo .lg path{stroke-dasharray:1;stroke-dashoffset:1;animation:trace .62s cubic-bezier(.3,.6,.2,1) forwards}
#logo .lg path:nth-of-type(2){animation-delay:.08s}
#logo .lg path:nth-of-type(3){animation-delay:.16s}
#logo .lg path:nth-of-type(4){animation-delay:.24s}
#logo .lg path:nth-of-type(5){animation-delay:.3s}
#logo .lg path:nth-of-type(6){animation-delay:.38s}
#logo .dot{opacity:0;animation:fadein .2s .62s forwards}
#logo .rim{transform-box:fill-box;transform-origin:center;animation:spin 16s linear infinite}
#logo .core{opacity:0;animation:fadein .4s .3s forwards}
@keyframes trace{0%{stroke-dashoffset:1;opacity:0}8%{opacity:1}100%{stroke-dashoffset:0;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.spacer{flex:1;min-height:120px}
.mbot{display:flex;flex-direction:column;gap:10px}
.read{display:flex;justify-content:space-between;align-items:flex-end;padding:0 2px 6px;border-bottom:1px solid rgba(var(--rgb),.22);margin-bottom:4px}
.read .rt{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.read .kick{margin-bottom:6px}
.keys{display:none;font-size:10.5px;letter-spacing:.12em;color:rgba(var(--rgb),var(--lab));text-transform:uppercase;padding-top:2px}
@media (hover:hover) and (pointer:fine){.keys{display:block}}

/* ---------- niveaux ---------- */
#levels::before{content:'';position:fixed;inset:0;background:rgba(4,7,10,.94);z-index:-1}
#levels{gap:12px}
#levels>*{animation:rise .26s cubic-bezier(.2,.8,.2,1) both}
.lhead{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:10px;border-bottom:1px solid rgba(var(--rgb),.22)}
#legacy{margin-top:8px}
#grid{flex:1;overflow-y:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:18px;padding:4px 0 12px;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 14px,#000 calc(100% - 18px),transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 14px,#000 calc(100% - 18px),transparent 100%)}
#grid::-webkit-scrollbar{display:none}
.ws{display:flex;flex-direction:column;gap:9px;color:var(--c)}
.wsh{appearance:none;border:0;border-radius:0;background:none;font:inherit;color:inherit;cursor:pointer;text-align:left;
  display:flex;align-items:center;gap:10px;padding:6px 2px;min-height:48px;border-bottom:1px solid rgba(var(--rgb),.18)}
.wsh .wn{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.wsh small{font-size:9.5px;letter-spacing:.16em;color:rgba(var(--rgb),var(--lab))}
.wsh .wst{display:flex;align-items:center;gap:10px;opacity:.9}
.wsh .chev{display:flex;width:18px;justify-content:center}
.wsh:active{filter:brightness(1.4)}
.wsh:focus-visible{outline:1px solid var(--c);outline-offset:2px}
.ws:not(.open) .cells{display:none}
.ws.lock{opacity:.42}
.cells{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.lv{position:relative;height:50px;border:0;border-radius:0;font:inherit;cursor:pointer;color:var(--c);background:rgba(var(--rgb),.4);
  display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:9px 8px 8px;
  clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,0 100%)}
.lv::before{content:'';position:absolute;inset:1px;background:var(--ink2);clip-path:polygon(0 0,calc(100% - 8.6px) 0,100% 8.6px,100% 100%,0 100%)}
.lv>*{position:relative}
.lv .pips{display:flex;gap:2px}
.lv .pips i{width:9px;height:9px;background:rgba(var(--rgb),.2);
  clip-path:polygon(50% 0,62% 35%,98% 36%,69% 58%,80% 93%,50% 72%,20% 93%,31% 58%,2% 36%,38% 35%)}
.lv .pips i.on{background:var(--c)}
.lv.boss::before{background:rgba(var(--rgb),.13)}
.lv.sp::after{content:'';position:absolute;right:6px;top:7px;width:7px;height:7px;background:rgba(var(--rgb),.85);transform:rotate(45deg)}
.lv.boss em{position:absolute;right:5px;top:17px;font:700 7px/1 var(--mono);letter-spacing:.1em;font-style:normal;color:rgba(var(--rgb),.85);writing-mode:vertical-rl}
.lv.cur{background:var(--hi);color:var(--hi)}
.lv.cur::before{background:linear-gradient(rgba(var(--rgb),.3),rgba(var(--rgb),.3)),var(--ink2)}
.lv.cur .pips i{background:rgba(var(--rgb),.45)}
.lv:disabled{cursor:default;color:rgba(var(--rgb),.3);background:rgba(var(--rgb),.14)}
.lv:active:not(:disabled){filter:brightness(1.4)}
.lfoot{display:flex}
.lfoot .btn{min-width:150px}

/* ---------- feuilles basses : victoire / échec / pause ---------- */
.sheet{justify-content:flex-end;pointer-events:none;padding:0}
.panel{pointer-events:auto;position:relative;display:flex;flex-direction:column;gap:11px;
  padding:30px 20px calc(max(14px,env(safe-area-inset-bottom)) + 8px);
  background:linear-gradient(180deg,rgba(4,7,10,0) 0,rgba(4,7,10,.9) 22px,rgba(4,7,10,.97) 56px);
  animation:rise .22s cubic-bezier(.2,.8,.2,1) both}
.panel::before{content:'';position:absolute;left:20px;right:20px;top:18px;height:1px;
  background:linear-gradient(90deg,var(--c) 0,var(--c) 38px,rgba(var(--rgb),.28) 38px)}
.panel .ttl{margin:2px 0 2px;color:var(--hi);filter:drop-shadow(0 0 9px rgba(var(--rgb),.55))}
.stats{display:flex;gap:18px}
.stats div{display:flex;flex-direction:column;gap:5px}
.stats b{font-weight:400;color:var(--hi)}
.hint{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(var(--rgb),var(--lab));text-align:left}
.rules{display:flex;flex-direction:column;gap:5px;margin:-2px 0 4px}
.rules div{font:11px/1.35 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:rgba(var(--rgb),var(--lab))}
.rules b{font-weight:400;color:var(--hi);margin-right:6px}
.wrules{display:flex;flex-direction:column;gap:5px;padding:4px 2px 2px}
.wrules div{font:10.5px/1.35 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:rgba(var(--rgb),var(--lab))}
.wrules b{font-weight:400;color:var(--hi);margin-right:6px}
.lv .tdot{position:absolute;right:6px;top:6px;width:8px;height:8px;border:1.5px solid var(--hi);border-radius:50%}
#pause::before{content:'';position:fixed;inset:0;background:rgba(4,7,10,.62);z-index:-1}
#fail .panel::before{background:linear-gradient(90deg,var(--alert) 0,var(--alert) 38px,rgba(var(--rgb),.28) 38px)}
#fail .ttl{color:var(--alert);filter:drop-shadow(0 0 9px rgba(var(--alert-rgb),.5))}

/* ---------- bouton pause ---------- */
#hudBtn{position:fixed;top:max(12px,env(safe-area-inset-top));left:calc(var(--sx) + 12px);z-index:4;width:44px;height:44px;
  border:0;background:none;color:var(--c);display:none;cursor:pointer;padding:0}
#hudBtn:active{filter:brightness(1.5)}

@media (max-height:600px){
  .tag{display:none}
  .panel{gap:8px;padding-top:26px}
  .btn{height:42px}.btn.pri{height:50px}
}
/* téléphone couché (hauteur ≤ 420 px) : menu compacté, et défilable en dernier recours (NIVEAUX et SON toujours atteignables) */
@media (max-height:420px){
  #menu{overflow-y:auto;overscroll-behavior:contain}
  #menu .mtop .kick{display:none}
  #logo{width:min(100%,220px)}
  .spacer{min-height:8px}
  .mbot{gap:7px}
  .read{padding-bottom:3px;margin-bottom:0}
}
/* ---------- garde-fou de démarrage ---------- */
#bootFail{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;
  background:#04070a;color:#4dffa6;font:12px/1.6 var(--mono);letter-spacing:.16em;text-transform:uppercase;text-align:center;cursor:pointer}
#bootFail b{font-weight:400;color:#e6fff2;font-size:14px}
#bootFail small{color:rgba(77,255,166,.6);font-size:10.5px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-delay:0s!important;transition:none!important}
  #logo .rim{animation:none}
}
</style>
<script>
/* Garde-fou de démarrage : si le jeu n'a pas démarré 4 s après l'ouverture, ou si une erreur survient avant
   la fin du démarrage (script manquant, invalide ou d'une autre version), on affiche un message au lieu d'un écran noir. */
(function () {
  var shown = false;
  function bootFail() {
    if (shown || window.__orbitaBooted) return;
    shown = true; window.__orbitaBootFailAt = performance.now();
    var d = document.createElement('div');
    d.id = 'bootFail'; d.setAttribute('role', 'alert');
    d.innerHTML = '<b>Le jeu n\u2019a pas d\u00e9marr\u00e9</b><span>Touche pour recharger</span><small>Orbita</small>';
    d.onclick = function () { location.reload(); };
    (document.body || document.documentElement).appendChild(d);
  }
  window.__orbitaBootFail = bootFail;
  addEventListener('error', function () { if (!window.__orbitaBooted) { window.__orbitaBootErr = true; bootFail(); } }, true);
  setTimeout(function () { if (!window.__orbitaBooted) bootFail(); }, Math.max(0, 3900 - performance.now()));   // ≤ 4 s après l'ouverture
})();
</script>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="bloom" aria-hidden="true"></canvas>
<div id="sat" style="position:fixed;top:0;height:env(safe-area-inset-top);width:0;pointer-events:none"></div>
<div id="sab" style="position:fixed;bottom:0;height:env(safe-area-inset-bottom);width:0;pointer-events:none"></div>
<button id="hudBtn" aria-label="Pause">
  <svg viewBox="0 0 44 44" width="44" height="44" aria-hidden="true"><path d="M.5 .5H34.5L43.5 9.5V43.5H9.5L.5 34.5Z" fill="rgba(4,7,10,.72)" stroke="currentColor" stroke-opacity=".5"/><path d="M17.5 15V29M26.5 15V29" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
</button>

<div id="menu" class="screen">
  <div class="mtop">
    <div class="kick">Un doigt · un tir · zéro contact</div>
    <svg id="logo" viewBox="-6 -4 314 72" role="img" aria-label="Orbita">
      <g class="lg" fill="none" stroke="currentColor" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round">
        <circle class="rim" cx="29" cy="32" r="26" stroke-dasharray="58 9 34 9 44.4 9"/>
        <path pathLength="1" d="M72 60V4H94L104 14V24L94 34H72M90 34L104 60"/>
        <path pathLength="1" d="M122 60V4H143L152 13V23L143 32H122M143 32L154 42V51L145 60H122"/>
        <path pathLength="1" d="M173 60V16"/>
        <path pathLength="1" d="M190 4H234M212 4V60"/>
        <path pathLength="1" d="M250 60L275 4L300 60"/>
        <path class="core" pathLength="1" stroke-width="1.7" d="M29 17L41 32L29 47L17 32ZM17 32L26.5 36.5L41 32M29 17L26.5 36.5L29 47"/>
      </g>
      <circle class="dot" cx="173" cy="9" r="5.2" fill="currentColor"/>
      <circle class="dot" cx="275" cy="47" r="4.4" fill="currentColor"/>
    </svg>
    <p class="txt tag">Plante tes aiguilles sur l’astre qui tourne.<br>Si deux se touchent, c’est perdu.</p>
  </div>
  <div class="spacer" id="spacer"></div>
  <div class="mbot">
    <div class="read">
      <div><div class="kick" id="mWorldK">Monde 01</div><div id="mWorld"></div></div>
      <div class="rt"><div class="kick">Étoiles</div><div id="totalStars"></div></div>
    </div>
    <div class="pw"><button class="btn pri" id="playBtn"></button></div>
    <div class="row">
      <button class="btn" id="levelsBtn"></button>
      <button class="btn" id="soundBtn"></button>
    </div>
    <div class="keys">Espace : tirer · P : pause</div>
  </div>
</div>

<div id="levels" class="screen">
  <div class="lhead"><div><div id="lvTitle"></div><div class="kick" id="legacy"></div></div><div id="totalStars2"></div></div>
  <div id="grid"></div>
  <div class="lfoot"><button class="btn" id="levelsBack"></button></div>
</div>

<div id="win" class="screen sheet">
  <div class="panel">
    <div class="kick" id="winKick"></div>
    <div class="ttl" id="winTitle"></div>
    <div class="stats" id="winStats"></div>
    <p class="txt" id="winMsg"></p>
    <div class="pw"><button class="btn pri" id="nextBtn"></button></div>
    <div class="row">
      <button class="btn" id="replayBtn"></button>
      <button class="btn" id="winMenu"></button>
    </div>
  </div>
</div>

<div id="fail" class="screen sheet">
  <div class="panel" id="failPanel">
    <div class="kick" id="failKick"></div>
    <div class="ttl" id="failTitle"></div>
    <p class="txt" id="failMsg"></p>
    <div class="pw"><button class="btn pri" id="retryBtn"></button></div>
    <div class="row">
      <div class="hint" style="align-self:center" id="failHint"></div>
      <button class="btn" id="failMenu"></button>
    </div>
  </div>
</div>

<div id="pause" class="screen sheet">
  <div class="panel">
    <div class="kick" id="pauseKick"></div>
    <div class="ttl" id="pauseTitle"></div>
    <div class="rules" id="pauseRules"></div>
    <div class="pw"><button class="btn pri" id="resumeBtn"></button></div>
    <div class="row">
      <button class="btn" id="restartBtn"></button>
      <button class="btn" id="pauseMenu"></button>
    </div>
  </div>
</div>

<script defer src="js/config.js?v=65"></script>
<script defer src="js/util.js?v=65"></script>
<script defer src="js/vector.js?v=65"></script>
<script defer src="js/levels.js?v=65"></script>
<script defer src="js/store.js?v=65"></script>
<script defer src="js/core.js?v=65"></script>
<script defer src="js/audio.js?v=65"></script>
<script defer src="js/fx.js?v=65"></script>
<script defer src="js/render.js?v=65"></script>
<script defer src="js/ui.js?v=65"></script>
<script defer src="js/main.js?v=65"></script>
</body>
</html>
